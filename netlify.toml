# Static site: no build step. The site files live in build/.
[build]
  publish = "build"
  command = "echo 'static site, nothing to build'"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
